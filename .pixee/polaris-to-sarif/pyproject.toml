[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blackduck-polaris-scripts"
version = "1.0.0"
description = "Convert Black Duck Polaris security findings to SARIF format"
readme = "README.md"
requires-python = ">=3.7"
authors = [
    {name = "Pixee", email = "support@pixee.ai"}
]
keywords = ["security", "sarif", "polaris", "blackduck", "static-analysis"]
dependencies = [
    "requests>=2.28.0",
    "tenacity>=8.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/pixee/blackduck-polaris-scripts"
Repository = "https://github.com/pixee/blackduck-polaris-scripts"
Issues = "https://github.com/pixee/blackduck-polaris-scripts/issues"

[project.scripts]
polaris-to-sarif = "polaris_to_sarif:app"

[tool.setuptools]
py-modules = ["polaris_to_sarif"]
